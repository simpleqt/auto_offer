<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>Cookie 弹窗测试页</title></head>
<body>
  <form>
    <label for="fullname">姓名</label>
    <input type="text" id="fullname" name="fullname">
    <label for="mail">邮箱</label>
    <input type="email" id="mail" name="mail">
    <label for="tel">电话</label>
    <input type="tel" id="tel" name="tel">
    <label for="school">毕业院校</label>
    <input type="text" id="school" name="school">
  </form>
  <div id="cookie-bar" style="position:fixed;bottom:0;left:0;right:0;z-index:9999;background:#333;color:#fff;padding:12px">
    我们使用 Cookie 以改善您的浏览体验。
    <button id="accept-cookie">同意所有 Cookie</button>
  </div>
</body>
</html>
