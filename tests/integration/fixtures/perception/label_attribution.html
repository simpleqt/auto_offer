<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>Label 归因测试页</title></head>
<body>
  <form>
    <!-- 1. label for -->
    <label for="f1">姓名</label>
    <input type="text" id="f1" name="f1">

    <!-- 2. 包裹式 label -->
    <label>手机号码 <input type="tel" name="f2"></label>

    <!-- 3. aria-label -->
    <input type="text" name="f3" aria-label="电子邮箱">

    <!-- 3b. aria-labelledby -->
    <span id="f4-label">毕业院校</span>
    <input type="text" name="f4" aria-labelledby="f4-label">

    <!-- 4. placeholder -->
    <input type="text" name="f5" placeholder="请输入期望薪资">

    <!-- 5. 同行左侧文本 -->
    <div class="row"><span class="row-label">现居城市</span><input type="text" name="f6"></div>

    <!-- 5b. 上方文本 -->
    <div class="row"><div class="above-label">自我介绍</div><textarea name="f7"></textarea></div>
  </form>
</body>
</html>
