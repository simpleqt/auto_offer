<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>单选复选测试页</title></head>
<body>
  <form>
    <fieldset>
      <legend>性别</legend>
      <label><input type="radio" name="gender" value="m" checked> 男</label>
      <label><input type="radio" name="gender" value="f"> 女</label>
    </fieldset>
    <fieldset>
      <legend>接受条件</legend>
      <label><input type="checkbox" name="travel" value="1"> 接受出差</label>
      <label><input type="checkbox" name="relocate" value="1"> 接受地点调剂</label>
    </fieldset>
    <div role="checkbox" aria-checked="false" tabindex="0">订阅职位提醒</div>
  </form>
</body>
</html>
