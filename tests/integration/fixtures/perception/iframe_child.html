<!DOCTYPE html>
<!-- iframe 内嵌子表单（由 iframe_host.html 引用） -->
<html lang="zh">
<head><meta charset="utf-8"><title>内嵌表单</title></head>
<body>
<form>
  <div>
    <label for="inner-name">iframe内姓名</label>
    <input id="inner-name" name="inner-name" type="text">
  </div>
  <div>
    <label for="inner-mail">iframe内邮箱</label>
    <input id="inner-mail" name="inner-mail" type="email">
  </div>
</form>
</body>
</html>
