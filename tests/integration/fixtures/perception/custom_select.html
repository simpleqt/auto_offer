<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>自定义控件测试页</title></head>
<body>
  <form>
    <div class="field">
      <span class="field-label">工作年限</span>
      <div class="ui-select picker" role="combobox" aria-haspopup="listbox" tabindex="0">3-5年</div>
    </div>
    <div class="field">
      <span class="field-label">期望薪资</span>
      <input type="text" class="cascader-input" readonly placeholder="请选择薪资范围">
    </div>
    <div class="field">
      <span class="field-label">到岗时间</span>
      <input type="text" class="date-picker-input" readonly placeholder="请选择日期">
    </div>
  </form>
</body>
</html>
