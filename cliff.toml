# git-cliff 配置：从 Conventional Commits 历史生成 CHANGELOG.md（docs/05 §5）。
# 生成命令：git-cliff -o CHANGELOG.md（未安装时手动维护，见 CHANGELOG.md 头部说明）

[changelog]
header = "# Changelog\n\n本项目遵循 [Conventional Commits](https://www.conventionalcommits.org/)，版本策略为 SemVer。\n"
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}(**{{ commit.scope }}**) {% endif %}\
{{ commit.message | upper_first }}\
{%- if commit.github.username %} ([@{{ commit.github.username }}](https://github.com/{{ commit.github.username }})){% endif %}
{%- endfor %}
{% endfor %}\
"""

[git]
conventional_commits = true
filter_unconventional = false
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^perf", group = "Performance" },
  { message = "^test", group = "Testing" },
  { message = "^docs", group = "Documentation" },
  { message = "^build", group = "Build & CI" },
  { message = "^chore", group = "Miscellaneous" },
]
