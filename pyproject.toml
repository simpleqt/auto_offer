[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autooffer"
version = "0.1.0"
description = "通用简历自动填写智能体（多智能体架构，OpenAI 兼容端点）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "playwright>=1.40",
    "langchain-openai>=1.0",
    "langchain-core>=1.0",
    "pydantic>=2.5",
    "fastapi>=0.110",
    "python-multipart>=0.0.9",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "pypdf>=4.0",
    "python-docx>=1.0",
    "pillow>=10.0",
    "PyYAML>=6.0",
    "structlog>=24.0",
    "keyring>=24.0",
    "httpx>=0.27",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "reportlab>=4.0",   # 生成测试用简历 PDF 资产
]

[project.scripts]
autooffer = "cli.main:app"
autooffer-app = "app.launcher:main"

[tool.setuptools.packages.find]
where = ["core", "server", "cli", "app"]
include = ["autooffer_core*", "autooffer_server*", "cli*", "app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "llm: 需要真实模型端点的端到端测试（默认跳过）",
]
addopts = "-m 'not llm'"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["core", "server", "cli", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "ASYNC", "S"]
ignore = [
    "S101",  # 测试中用 assert
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]

[tool.mypy]
python_version = "3.11"
mypy_path = ["core", "server", "cli", "app"]
packages = ["autooffer_core"]
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["autooffer_server.*", "tests.*", "app.*", "scripts.*"]
strict = false
disallow_untyped_defs = true
