<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <span class="brand-group">
      <img class="brand-logo" src="../icons/icon48.png" alt="" />
      <span class="brand">AutoOffer 简历助手</span>
    </span>
    <span id="status-dot" class="dot off" title="本地服务状态"></span>
  </header>

  <section id="server-line">
    <span id="server-state">检查本地服务…</span>
    <button id="btn-grant" class="mini hidden">授权连接</button>
  </section>

  <label class="row">
    <span>档案</span>
    <select id="profile-select" disabled></select>
  </label>

  <label class="row checkbox">
    <input type="checkbox" id="opt-sensitive" />
    <span>包含敏感字段（身份证号、家庭情况等）</span>
  </label>

  <button id="btn-fill" disabled>开始填写</button>
  <div id="hint" class="hint">填写前请先在页面打开目标表单。</div>

  <section id="report" class="hidden">
    <div id="fill-rate" class="rate-box">
      <span id="rate-num" class="rate-num">0%</span>
      <span class="rate-label">填充率<br /><span id="rate-detail" class="rate-detail"></span></span>
    </div>
    <div id="report-title"></div>
    <div id="form-errors" class="form-errors hidden"></div>
    <ul id="report-list"></ul>
  </section>

  <section id="log-section">
    <div class="row">
      <span>运行日志</span>
      <span>
        <button id="btn-log" class="mini">查看</button>
        <button id="btn-log-copy" class="mini">复制</button>
        <button id="btn-log-clear" class="mini">清空</button>
      </span>
    </div>
    <pre id="log-view" class="hidden"></pre>
  </section>

  <footer>
    <label class="row">
      <span>服务地址</span>
      <input id="api-base" type="text" spellcheck="false" />
    </label>
    <button id="btn-save-api" class="mini">保存</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
