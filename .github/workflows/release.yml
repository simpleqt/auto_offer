name: Release

# tag v* 触发：版本号注入 → 打包安装程序（Windows runner）→ 产出安装包 + SHA256 → GitHub Release 草稿。
# 打包依赖 Inno Setup（choco 安装）与 Playwright Chromium 缓存。

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pyinstaller

      - name: Install Chromium
        run: playwright install chromium

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: cmd
        run: python scripts/build_installer.py

      - name: Compute SHA256
        shell: pwsh
        run: |
          Get-FileHash dist\AutoOffer-Setup.exe -Algorithm SHA256 |
            Select-Object -ExpandProperty Hash |
            Out-File dist\AutoOffer-Setup.exe.sha256 -Encoding ascii

      - name: Create GitHub Release draft
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/AutoOffer-Setup.exe
            dist/AutoOffer-Setup.exe.sha256
